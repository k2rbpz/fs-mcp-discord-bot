substitutions:
  _VM_NAME: discord-bot-vm
  _VM_ZONE: us-central1-a
  _ENV_FILE_PATH: /home/marqu/fs-mcp-discord-mastra2.env

steps:
# Step 1: Get the version from package.json and write it to a file.
# The /workspace directory is shared between all build steps.
- name: 'gcr.io/cloud-builders/gcloud'
  id: GetVersion
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    # The gcloud image doesn't have jq by default, so we install it.
    apt-get update && apt-get install -y jq
    jq -r .version package.json > /workspace/version.txt
    echo "Version $$(cat /workspace/version.txt) will be used."

# Step 2: Build and tag all the images.
- name: 'gcr.io/cloud-builders/docker'
  id: BuildAndTag
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    VERSION=$$(cat /workspace/version.txt)
    docker build \
      -t us-docker.pkg.dev/${PROJECT_ID}/gcr.io/fs-mcp-discord-mastra2:$COMMIT_SHA \
      -t us-docker.pkg.dev/${PROJECT_ID}/gcr.io/fs-mcp-discord-mastra2:latest \
      -t us-docker.pkg.dev/${PROJECT_ID}/gcr.io/fs-mcp-discord-mastra2:$$VERSION \
      .

# Step 3: Push all the images in a single, efficient step.
- name: 'gcr.io/cloud-builders/docker'
  id: Push
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    VERSION=$$(cat /workspace/version.txt)
    docker push us-docker.pkg.dev/${PROJECT_ID}/gcr.io/fs-mcp-discord-mastra2:$COMMIT_SHA
    docker push us-docker.pkg.dev/${PROJECT_ID}/gcr.io/fs-mcp-discord-mastra2:latest
    docker push us-docker.pkg.dev/${PROJECT_ID}/gcr.io/fs-mcp-discord-mastra2:$$VERSION

# Step 4: Copy deployment script to the VM
- name: 'gcr.io/cloud-builders/gcloud'
  id: CopyScript
  args:
    - 'compute'
    - 'scp'
    - './deploy.sh'
    - '${_VM_NAME}:/tmp/deploy.sh'
    - '--zone=${_VM_ZONE}'
    - '--project=${PROJECT_ID}'

# Step 5: Execute the deployment script on the VM
- name: 'gcr.io/cloud-builders/gcloud'
  id: ExecuteDeployment
  args:
    - 'compute'
    - 'ssh'
    - '${_VM_NAME}'
    - '--zone=${_VM_ZONE}'
    - '--project=${PROJECT_ID}'
    - '--'
    - 'bash'
    - '/tmp/deploy.sh'
    - 'us-docker.pkg.dev/${PROJECT_ID}/gcr.io/fs-mcp-discord-mastra2:$COMMIT_SHA'
    - '${_ENV_FILE_PATH}'

images:
- 'us-docker.pkg.dev/${PROJECT_ID}/gcr.io/fs-mcp-discord-mastra2:$COMMIT_SHA'
- 'us-docker.pkg.dev/${PROJECT_ID}/gcr.io/fs-mcp-discord-mastra2:latest'

options:
  logging: CLOUD_LOGGING_ONLY
