steps:
# Step 1: Get the version from package.json and write it to a file.
# The /workspace directory is shared between all build steps.
- name: 'gcr.io/cloud-builders/gcloud'
  id: GetVersion
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    # The gcloud image doesn't have jq by default, so we install it.
    apt-get update && apt-get install -y jq
    jq -r .version package.json > /workspace/version.txt
    echo "Version $$(cat /workspace/version.txt) will be used."

# Step 2: Build and tag all the images.
- name: 'gcr.io/cloud-builders/docker'
  id: BuildAndTag
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    VERSION=$$(cat /workspace/version.txt)
    docker build \
      -t us-docker.pkg.dev/pine-vision-sql-studio/gcr.io/fs-mcp-discord-mastra2:$COMMIT_SHA \
      -t us-docker.pkg.dev/pine-vision-sql-studio/gcr.io/fs-mcp-discord-mastra2:latest \
      -t us-docker.pkg.dev/pine-vision-sql-studio/gcr.io/fs-mcp-discord-mastra2:$$VERSION \
      .

# Step 3: Push all the images in a single, efficient step.
- name: 'gcr.io/cloud-builders/docker'
  id: Push
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    VERSION=$$(cat /workspace/version.txt)
    docker push us-docker.pkg.dev/pine-vision-sql-studio/gcr.io/fs-mcp-discord-mastra2:$COMMIT_SHA
    docker push us-docker.pkg.dev/pine-vision-sql-studio/gcr.io/fs-mcp-discord-mastra2:latest
    docker push us-docker.pkg.dev/pine-vision-sql-studio/gcr.io/fs-mcp-discord-mastra2:$$VERSION

# Step 4: Deploy to GCE by restarting the container with the new image.
# This step assumes an environment file already exists on the VM.
- name: 'gcr.io/cloud-builders/gcloud'
  id: DeployToVM
  entrypoint: 'bash'
  args:
  - '-c'
  - |
    # IMPORTANT: Replace '/path/to/your/fs-mcp-discord-mastra2.env'
    # with the actual, absolute path to your environment file on the VM.
    # Also, ensure the zone (us-central1-a) matches your VM's zone.
    gcloud compute ssh discord-bot-vm \
      --project="pine-vision-sql-studio" \
      --zone="us-central1-a" \
      --command=" \
        set -e; \
        IMAGE_URL=us-docker.pkg.dev/pine-vision-sql-studio/gcr.io/fs-mcp-discord-mastra2:$COMMIT_SHA; \
        ENV_FILE_PATH=/home/marqu/fs-mcp-discord-mastra2.env; \
        echo '--- Pulling new image: $$IMAGE_URL'; \
        docker pull $$IMAGE_URL; \
        echo '--- Stopping and removing old container...'; \
        docker stop discord-bot || true; \
        docker rm discord-bot || true; \
        echo '--- Starting new container using environment file at $$ENV_FILE_PATH...'; \
        docker run -d --restart=always --name discord-bot \
          --env-file $$ENV_FILE_PATH \
          $$IMAGE_URL; \
        echo '--- Deployment to GCE complete.'; \
      "

images:
- 'us-docker.pkg.dev/pine-vision-sql-studio/gcr.io/fs-mcp-discord-mastra2:$COMMIT_SHA'
- 'us-docker.pkg.dev/pine-vision-sql-studio/gcr.io/fs-mcp-discord-mastra2:latest'

options:
  logging: CLOUD_LOGGING_ONLY
